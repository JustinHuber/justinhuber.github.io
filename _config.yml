encoding: utf-8
timezone: Asia/Shanghai
lang: zh-CN

plugins:
  - jekyll-regex-replace
  - jekyll-sitemap
  - jekyll-feed

# Site
title: Justin Blog
description: Justin 的个人技术博客，记录 Java、Web、运维、生活与折腾笔记。
keywords: Justin, Blog, Java, Html, JavaScript, 运维, 远程工作
author: Justin Huber
email: 424372929@qq.com
url: https://blog.nasspace.dpdns.org
baseurl: ''
domainUrl: 'https://blog.nasspace.dpdns.org'

# Collections / permalinks
permalink: /posts/:year/:month/:day/:title.html
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text

exclude:
  - CNAME
  - README.md
  - LICENSE
  - _site
  - dist
  - Gemfile
  - Gemfile.lock
  - blog.sh
  - node_modules

# Menu
menu:
  - title: 首页
    url: /
  - title: 归类
    url: /pages/categories.html
  - title: 搜索
    url: /pages/search.html
  - title: 友链
    url: /pages/links.html
  - title: 留言
    url: /pages/chat.html
  - title: 关于
    url: /pages/about.html

# Extensions
extClickEffect: true
extAdsense: false
extMath: false
extCount: true

# Third-party
tucaoUrl: https://support.qq.com/product/679362

# Footer
footerText: 'Copyright © 2024 Justin Huber'

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "mypost"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Social / links
links:
  - title: Joey Blog
    url: https://joeyblog.net/
  - title: ddsrem
    url: https://blog.ddsrem.com/
  - title: 祈雨的博客
    url: https://wakzz.cn
  - title: 琼西往事
    url: https://fushaolei.github.io
  - title: Py's Whisper
    url: https://whisper.pyliubaolin.top
  - title: tmaize's Blog
    url: https://blog.tmaize.net/
  - title: amclubss
    url: https://firebase.amclubss.com/
  - title: 咕咚同学
    url: https://gudong.site
  - title: 大葱博客
    url: https://blog.zzzdc.com/
  - title: p3terx zone
    url: https://p3terx.com/
